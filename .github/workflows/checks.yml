name: Validate Python (offline)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Static check for accidental secrets and data
        run: |
          test ! -d wallpapers
          test ! -d backups
          test ! -d bin
      - name: Unit tests (no KDE calls)
        run: python -m pytest -q
