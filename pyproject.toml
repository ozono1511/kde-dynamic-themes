[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kde-dynamic-themes"
version = "3.0.2"
description = "A lightweight Matugen-powered wallpaper and color gallery for KDE Plasma 6"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "KDE Dynamic Themes contributors" }]
classifiers = ["Programming Language :: Python :: 3", "Environment :: X11 Applications :: Qt", "Operating System :: POSIX :: Linux"]

[project.optional-dependencies]
gui = ["PySide6>=6.11,<6.12"]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[project.scripts]
kde-dynamic-themes = "kde_dynamic_themes.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".venv", "build", "dist"]
